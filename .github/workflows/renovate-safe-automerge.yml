name: Renovate Safe Auto-Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-safe-automerge:
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for safe Renovate updates
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const title = (pr.title || '').toLowerCase();

            // Keep scope narrow: only minor/patch updates are auto-merged.
            const looksSafe = title.includes('minor') || title.includes('patch');
            if (!looksSafe) {
              core.info(`Skip auto-merge for PR title: ${pr.title}`);
              return;
            }

            const pullRequestId = pr.node_id;
            await github.graphql(
              `mutation($pullRequestId: ID!) {
                enablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId, mergeMethod: SQUASH }) {
                  clientMutationId
                }
              }`,
              { pullRequestId }
            );

            core.info(`Auto-merge enabled for PR #${pr.number}`);
