name: Sync fork from upstream

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork master branch
        run: gh repo sync ${{ github.repository }} --branch master
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
